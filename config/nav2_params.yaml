amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 300
    max_particles: 1500
    laser_max_range: 8.0
    set_initial_pose: true
    initial_pose: {x: -4.0, y: -4.0, z: 0.0, yaw: 0.0}
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_d: 0.1
    update_min_a: 0.1

